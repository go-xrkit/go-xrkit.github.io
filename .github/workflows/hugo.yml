# Build + deploy the Hugo site to GitHub Pages on every push to main.
# Adapted from the official Hugo template at
# https://gohugo.io/host-and-deploy/host-on-github-pages/.

name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  # Build on every pull request too, so a change to the layout, the content or
  # the Hugo version has to prove the site still builds before it lands.
  # Without this the workflow ran only on main, which meant a dependency bump
  # arrived with no signal at all -- its checks read "no checks", which is not
  # the same thing as green and must not be merged as if it were.
  pull_request:
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued. Don't cancel in-progress
# runs — we want them to finish before a new build replaces them.
concurrency:
  group: "pages"
  cancel-in-progress: false

# The build needs nothing beyond the source and the Pages configuration it
# reads to compute the base URL. Publishing rights are granted to the deploy
# job alone, below, so a pull request build cannot replace what is served.
permissions:
  contents: read
  pages: read

# ⛔ THE ONLY HUGO VERSION IN THIS REPOSITORY. There were two, in two files,
# 34 minor releases apart (#27). Bump it here and both the build and the kit
# check move together, because the check no longer builds anything.
env:
  HUGO_VERSION: "0.169.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins — and the same toolchain installs
      # Hugo itself, below.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # ⛔ FROM THE MODULE PROXY, AND THERE IS NOW EXACTLY ONE PIN IN THIS
      # REPOSITORY. The history of this step is the argument:
      #
      #   .deb fetched by wget, `sudo dpkg -i`, NO checksum, pinned 0.135.0
      #     — while the kit check next door ran 0.169.0 through an action, so
      #       the site anybody was served was never the site whose rules were
      #       read, 34 minor releases apart (#27).
      #   then both on the same action at 0.169.0 — one version, still an
      #     unverified release asset, and still two files holding the number.
      #   now `go install`, which go-xrkit/docs already does and says why:
      #     proxy.golang.org with the checksum database vouching for the bytes
      #     is a stronger guarantee than the sha256 that step used to verify.
      #
      # ⭐ extended is NOT needed, measured rather than assumed: neither this
      # site nor landingkit v0.29.0 contains a single `.scss` or `toCSS`, and
      # the plain binary builds this site and passes `landingkit check` (run
      # locally at v0.169.0 before this was written). So the one thing `go
      # install` cannot build is the one thing nothing here uses.
      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: go install "github.com/gohugoio/hugo@v${HUGO_VERSION}"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # The kit's rules, read from the artifact that will be DEPLOYED rather than
  # from a second build of the same source. That is what #27 was about: a judge
  # and its subject built by different Hugos. Aligning the versions was half of
  # it; reading the same bytes is the whole of it, and it cannot drift again.
  kit:
    name: the page follows the kit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artifact
      # upload-pages-artifact ships a single artifact.tar; unpacking it gives
      # back exactly the tree Pages serves.
      - name: Unpack the deployable artifact
        run: |
          mkdir -p public
          tar -xf artifact/artifact.tar -C public
      - name: Check
        env:
          GOWORK: "off"
        run: go run github.com/go-fleettools/landingkit/cmd/landingkit check public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only main publishes. A pull request stops after build above: it has built
    # the site, which is the whole point of the gate, and it has no business
    # replacing what is served.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
