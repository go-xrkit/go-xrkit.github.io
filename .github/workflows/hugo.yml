# Build + deploy the Hugo site to GitHub Pages on every push to main.
# Adapted from the official Hugo template at
# https://gohugo.io/host-and-deploy/host-on-github-pages/.

name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  # Build on every pull request too, so a change to the layout, the content or
  # the Hugo version has to prove the site still builds before it lands.
  # Without this the workflow ran only on main, which meant a dependency bump
  # arrived with no signal at all -- its checks read "no checks", which is not
  # the same thing as green and must not be merged as if it were.
  pull_request:
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued. Don't cancel in-progress
# runs — we want them to finish before a new build replaces them.
concurrency:
  group: "pages"
  cancel-in-progress: false

# The build needs nothing beyond the source and the Pages configuration it
# reads to compute the base URL. Publishing rights are granted to the deploy
# job alone, below, so a pull request build cannot replace what is served.
permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ⛔ THE SAME VERSION AS landingkit-check.yml, AND THE SAME WAY OF GETTING
      # IT. This job used to fetch hugo_extended's .deb with wget and install it
      # with `sudo dpkg -i`, verifying no checksum, pinned at 0.135.0 — while
      # the kit check next door ran 0.169.0 through this action. The site that
      # got PUBLISHED was therefore never the site whose rules were read, 34
      # minor releases apart (go-xrkit/go-xrkit.github.io#27).
      #
      # The version lives in this one input in both files because that is the
      # one Renovate maintains: its github-actions manager updates
      # `hugo-version` as a `uses-with` dependency, which is exactly why the
      # action's pin was current and the hand-rolled env var was not.
      - name: Install Hugo CLI
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          # Same binary as the kit check, not merely the same version number.
          # Measured 2026-11-15: neither this site nor landingkit v0.29.0 holds
          # a single `.scss` or `toCSS`, so extended earns nothing here — but a
          # judge built differently from its subject is the defect this change
          # exists to remove, so both stay extended until both move together.
          extended: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only main publishes. A pull request stops after build above: it has built
    # the site, which is the whole point of the gate, and it has no business
    # replacing what is served.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
